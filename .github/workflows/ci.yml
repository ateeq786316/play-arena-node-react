name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 1234
          POSTGRES_DB: playarena
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: playarena-backend/package-lock.json

      - name: Install dependencies
        working-directory: ./playarena-backend
        run: npm ci

      - name: Generate Prisma client
        working-directory: ./playarena-backend
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://postgres:1234@localhost:5432/playarena?schema=public

      - name: Run migrations
        working-directory: ./playarena-backend
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:1234@localhost:5432/playarena?schema=public

      - name: Run tests
        working-directory: ./playarena-backend
        run: npm test
        env:
          DATABASE_URL: postgresql://postgres:1234@localhost:5432/playarena?schema=public
          JWT_SECRET: test-jwt-secret-that-is-at-least-32-characters-long
          ACCESSTOKEN: test-access-token-secret-that-is-long-enough
          REFRESHTOKEN: test-refresh-token-secret-that-is-long-enough
          GOOGLE_CALLBACK_URL: http://localhost:3000/api/user/google/callback
          GOOGLE_CLIENT_ID: test-client-id
          GOOGLE_CLIENT_SECRET: test-client-secret
